<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eef3" />
    <meta name="description" content="Sanghvi Agency — Premium steel & construction material supplier in Bhuj, Kutch & Gujarat since 2001. TMT bars, structural steel, angles, channels, beams from Tata Tiscon, JSW, SAIL, Jindal & more." />
    <meta property="og:title" content="Sanghvi Agency — Building Strong Foundations Since 2001" />
    <meta property="og:description" content="Premium steel & construction material supplier serving builders, contractors & industries across Kutch & Gujarat." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem('sanghvi-theme') === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#11171c' : '#e9eef3');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Sanghvi Agency — Premium Steel Supplier in Bhuj, Kutch & Gujarat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
